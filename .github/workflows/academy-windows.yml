# Builds the Claude Code Academy Windows installer whenever the app changes.
# Download it from the workflow run's "Artifacts" section on GitHub.
name: Claude Code Academy installer
on:
  push:
    paths: ["claude-code-academy/**", ".github/workflows/academy-windows.yml"]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: claude-code-academy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: claude-code-academy/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Claude-Code-Academy-Setup
          path: claude-code-academy/dist/*.exe
          if-no-files-found: error
