<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Life Control Center</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><circle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='3'/><circle cx='16' cy='16' r='2.5' fill='white'/></svg>">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before the page draws, so there's no flash.
    try {
      const t = localStorage.getItem("lcc-theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Life Control Center</span>
      </div>
      <nav id="nav"></nav>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu"></button>
        <form class="command" id="command-form" autocomplete="off">
          <span class="command-icon" aria-hidden="true"></span>
          <input id="command-input" type="text" enterkeyhint="send"
                 placeholder="Tell me what happened…"
                 aria-label="Command bar: type a sentence like 'Add a work task to email Sarah by Friday'">
          <button class="command-send" id="command-send" type="submit" aria-label="Send"></button>
        </form>
      </header>
      <div class="command-result" id="command-result" hidden></div>
      <div class="notice" id="key-notice" hidden>
        The command bar needs an Anthropic API key. Add it to your <code>.env</code> file and restart the app. See the README, step 3.
      </div>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
