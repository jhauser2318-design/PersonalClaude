<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Life Control Center</title>
  <link rel="icon" href="icon.png">
  <!--
    Shown the moment you open the desktop app, while the launcher checks for
    updates and starts the app. It keeps trying to reach the app and switches
    to it as soon as it answers.
  -->
  <style>
    :root { --bg: #070a12; --text: #e7ebf5; --text-2: #9ba5ba; --text-3: #636e86; color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      background-color: var(--bg); color: var(--text); display: grid; place-items: center;
      background-image:
        radial-gradient(700px 500px at 20% 10%, rgba(99, 102, 241, .22), transparent 60%),
        radial-gradient(600px 500px at 90% 90%, rgba(34, 211, 238, .14), transparent 60%),
        linear-gradient(rgba(148, 163, 184, .05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, .05) 1px, transparent 1px);
      background-size: auto, auto, 44px 44px, 44px 44px;
      font: 15px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .box { text-align: center; padding: 16px; }
    .core {
      width: 92px; height: 92px; margin: 0 auto; border-radius: 50%; position: relative;
      background: conic-gradient(from 0deg, #22d3ee, #818cf8, #c084fc, #22d3ee);
      animation: spin 2.4s linear infinite; box-shadow: 0 0 50px rgba(129, 140, 248, .5);
    }
    .core::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--bg); }
    .core-in { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; animation: spin 2.4s linear infinite reverse; }
    .core-in img { width: 44px; height: 44px; border-radius: 12px; }
    h1 { font: 650 20px/1.2 "Space Grotesk", "Inter", system-ui, sans-serif; margin: 24px 0 8px; letter-spacing: -.01em; }
    p { color: var(--text-3); margin: 0; font: 500 11.5px/1.6 "JetBrains Mono", ui-monospace, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="core" aria-hidden="true"><div class="core-in"><img src="icon.png" alt=""></div></div>
    <h1>Life Control Center</h1>
    <p id="status">Checking for updates…</p>
  </div>
  <script>
    const APP = "http://localhost:8000";
    // Opened from a notification: go straight to that page (e.g. #followups).
    const page = location.hash.slice(1).replace(/[^a-z0-9/-]/gi, "");
    const TARGET = page ? `${APP}/#/${page}` : APP;
    const started = Date.now();
    const status = document.getElementById("status");

    function tryApp() {
      const probe = new Image();
      probe.onload = () => location.replace(TARGET);
      probe.onerror = () => {
        const secs = (Date.now() - started) / 1000;
        if (secs > 6) status.textContent = "Starting the app…";
        if (secs > 45) status.textContent = "This is taking longer than usual (installing an update?). Hang on…";
        setTimeout(tryApp, 500);
      };
      probe.src = `${APP}/icon.png?t=${Date.now()}`;
    }
    tryApp();
  </script>
</body>
</html>
