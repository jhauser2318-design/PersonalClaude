<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Life Control Center</title>
  <link rel="icon" href="icon.png">
  <!--
    Shown the moment you open the desktop app, while the launcher checks for
    updates and starts the app. It keeps trying to reach the app and switches
    to it as soon as it answers.
  -->
  <style>
    :root { --bg: #f6f7fb; --text: #171a23; --text-2: #5b6272; --accent: #4f46e5; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1117; --text: #eceef4; --text-2: #a4abbb; --accent: #8b87ff; color-scheme: dark; }
    }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--text); display: grid; place-items: center;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .box { text-align: center; padding: 16px; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 20px; margin: 18px 0 6px; }
    p { color: var(--text-2); margin: 0; }
    .spinner {
      width: 22px; height: 22px; margin: 22px auto 0; border-radius: 50%;
      border: 3px solid color-mix(in srgb, var(--accent) 25%, transparent);
      border-top-color: var(--accent); animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <img src="icon.png" alt="">
    <h1>Life Control Center</h1>
    <p id="status">Checking for updates…</p>
    <div class="spinner" aria-hidden="true"></div>
  </div>
  <script>
    const APP = "http://localhost:8000";
    const started = Date.now();
    const status = document.getElementById("status");

    function tryApp() {
      const probe = new Image();
      probe.onload = () => location.replace(APP);
      probe.onerror = () => {
        const secs = (Date.now() - started) / 1000;
        if (secs > 6) status.textContent = "Starting the app…";
        if (secs > 45) status.textContent = "This is taking longer than usual (installing an update?). Hang on…";
        setTimeout(tryApp, 500);
      };
      probe.src = `${APP}/icon.png?t=${Date.now()}`;
    }
    tryApp();
  </script>
</body>
</html>
